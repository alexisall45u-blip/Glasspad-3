name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add widget, icon and stable signing key
        run: |
          P=android/app/src/main
          mkdir -p $P/java/com/glasspad/notes
          cp native/java/*.java $P/java/com/glasspad/notes/
          cp -r native/res/. $P/res/
          python3 native/patch_manifest.py
          mkdir -p ~/.android
          if [ -f native/debug.keystore ]; then cp native/debug.keystore ~/.android/debug.keystore; fi
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Glasspad-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
